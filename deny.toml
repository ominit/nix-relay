[advisories]
unmaintained = "workspace"
unused-ignored-advisory = "deny"

[licenses]
allow = [
  "Apache-2.0",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
]
unused-allowed-license = "deny"

[licenses.private]
ignore = true

[sources]
unknown-git = "deny"
unknown-registry = "deny"
unused-allowed-source = "deny"
