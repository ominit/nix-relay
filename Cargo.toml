[workspace]
members = [
  "crates/nix-relay-protocol",
  "crates/nix-relay-server",
  "crates/nix-relay-worker",
  "crates/nixr",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.100.0"
version = "0.1.0"

[workspace.lints.cargo]
unused_dependencies = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
await_holding_lock = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
dbg_macro = "deny"
expect_used = "deny"
filetype_is_file = "deny"
future_not_send = "deny"
implicit_clone = "deny"
indexing_slicing = "deny"
large_futures = "deny"
large_stack_arrays = "deny"
manual_let_else = "deny"
map_err_ignore = "deny"
mod_module_files = "deny"
mutex_atomic = "deny"
needless_collect = "deny"
panic = "deny"
panic_in_result_fn = "deny"
readonly_write_lock = "deny"
redundant_clone = "deny"
redundant_test_prefix = "deny"
significant_drop_in_scrutinee = "deny"
significant_drop_tightening = "deny"
todo = "deny"
unchecked_time_subtraction = "deny"
unimplemented = "deny"
uninlined_format_args = "deny"
unused_async = "deny"
unwrap_used = "deny"
wildcard_enum_match_arm = "deny"

[workspace.lints.rust]
elided_lifetimes_in_paths = "deny"
redundant_imports = "deny"
redundant_lifetimes = "deny"
trivial_numeric_casts = "deny"
unsafe_code = "deny"
unused_lifetimes = "deny"
unused_macro_rules = "deny"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 1

[profile.release]
codegen-units = 1
lto = true
strip = true

[workspace.dependencies]
nix-relay-protocol = { path = "crates/nix-relay-protocol" }

axum = { version = "0.8.9", default-features = false, features = [
  "http1",
  "tokio",
  "ws",
] }
clap = { version = "4.6.1", features = ["derive"] }
color-eyre = "0.6.5"
futures-util = { version = "0.3.32", features = ["sink"] }
reqwest = "0.13.4"
serde = { features = ["derive"], version = "1.0.228" }
serde_json = "1.0.150"
tempfile = "3.27.0"
tokio = { features = ["full"], version = "1.52.3" }
tokio-tungstenite = "0.30.0"
toml = "1.1.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
